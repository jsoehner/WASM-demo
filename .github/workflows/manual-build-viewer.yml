name: Manual Build Viewer Packages

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload build artifacts
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-package:
    name: Build and Package Viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.7.7

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'latest'

      - name: Make script executable
        run: chmod +x build.sh
      - name: Build and package
        run: ./build.sh --package

      - name: List generated archives
        run: |
          ls -la wasm-agent-viewer-*.zip 2>/dev/null || true
          ls -la wasm-agent-viewer-*.tar.gz 2>/dev/null || true

      - name: Upload distribution artifacts
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-distribution-${{ github.run_id }}
          path: |
            wasm-agent-viewer-*.zip
            wasm-agent-viewer-*.tar.gz
          if-no-files-found: error
          retention-days: 7
