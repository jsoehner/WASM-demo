name: JSI Build & Functional Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    uses: jsoehner/jsi-build-verify/.github/workflows/jsi-build-verify.yml@main
    with:
      commit_mode: report-only
      fail_on_error: true
      comment_on_pr: true
    secrets: inherit
