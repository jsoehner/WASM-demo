name: JSI Build & Functional Verification

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    uses: jsoehner/jsi-build-verify/.github/workflows/jsi-build-verify.yml@e73421afb9a5a7164eec11187a4794acde903e38 # v1.0.1
    with:
      workflow_ref: e73421afb9a5a7164eec11187a4794acde903e38
      model: gemini-2.5-flash
      thinking: low
      commit_mode: report-only
      fail_on_error: true
      comment_on_pr: false
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OSS_MTLS_CLIENT_CERT: ${{ secrets.OSS_MTLS_CLIENT_CERT }}
      OSS_MTLS_CLIENT_KEY: ${{ secrets.OSS_MTLS_CLIENT_KEY }}
